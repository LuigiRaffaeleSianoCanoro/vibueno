# Cloudflare Pages project vibueno (direct upload). Bindings match the Pages dashboard.
name = "vibueno"
compatibility_date = "2025-11-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "vibueno-prod"
database_id = "82488743-3c20-41b8-937d-0bb93351e07d"

[[kv_namespaces]]
