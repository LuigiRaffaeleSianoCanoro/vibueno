name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install hosted dependencies
        run: npm ci
        working-directory: hosted

  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: unit-tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: hosted
      - name: unit-tests
        run: npm test
        env:
          GITHUB_SHA: ${{ github.sha }}

  build:
    name: build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hosted/package-lock.json
      - run: npm ci
        working-directory: hosted
      - name: build
        run: npm run build:pages
        working-directory: hosted
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Worker syntax
        run: node --check public/_worker.js
        working-directory: hosted

  route-manifest:
    name: route-manifest
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: route-manifest
        run: npm run check:routes