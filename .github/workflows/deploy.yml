# Production deploy: single artifact, post-deploy smoke, auto-rollback (FAB-190 follow-up).
name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    steps:
      - name: Resolve deploy SHA
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix hosted

      - name: Check Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see AGENTS.md / README)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build single artifact
        if: steps.cf.outputs.skip != 'true'
        run: npm run build
        env:
          GITHUB_SHA: ${{ steps.meta.outputs.sha }}

      - name: Skip notice
        if: steps.cf.outputs.skip == 'true'
        run: echo "Deploy not run (Cloudflare secrets not configured)."

      - name: Deploy, smoke, rollback
        if: steps.cf.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ steps.meta.outputs.sha }}
          VIBUENO_PRODUCTION_URL: ${{ vars.VIBUENO_PRODUCTION_URL }}
          VIBUENO_ALLOW_FIRST_DEPLOY: ${{ vars.VIBUENO_ALLOW_FIRST_DEPLOY }}
          WRANGLER_VERSION: '4.45.0'
        run: node scripts/run-production-deploy.mjs